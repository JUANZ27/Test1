ifx.client-id=7c6e3033c81c814b9858087daf6da2a1
ifx.client-secret=46d0cee11adeabf7973d07f9a2b5a9a8
ifx.subscription-key=${ifx.client-id}
ifx.subscription-secret=${ifx.client-secret}
ifx.scope-transaccion=scopeTransaccionH1
ifx.scope-consulta=scopeConsultaH1

# Token transaccional para crear cliente PN, crear cliente PJ y crear cuenta.
# Equivale al curl del token con scope={{ifx_scope_transaccion}}
ifx.transaccion.token-path=/oauthproviderh1/oauth2/token
ifx.transaccion.grant-type=password
ifx.transaccion.username=${ifx.username}
ifx.transaccion.password=${ifx.password}
ifx.transaccion.client-id=${ifx.client-id}
ifx.transaccion.client-secret=${ifx.client-secret}
ifx.transaccion.scope=${ifx.scope-transaccion}

# Token consulta full-information/retrieve
# Este token usa el mismo endpoint oauthproviderh1/oauth2/token, pero con scope de consulta.
# Equivale al curl: grant_type=password, username, password, client_id, client_secret, scope={{ifx_scope_consulta}}
ifx.consulta.token-path=/oauthproviderh1/oauth2/token
ifx.consulta.grant-type=password
ifx.consulta.username=${ifx.username}
ifx.consulta.password=${ifx.password}
ifx.consulta.client-id=${ifx.client-id}
ifx.consulta.client-secret=${ifx.client-secret}
ifx.consulta.scope=${ifx.scope-consulta}

# Authorization por tipo de token.
# Crear PN/PJ/cuenta usa token transaccional. Consulta full usa token consulta.
# Por defecto se envia: Authorization: Bearer <access_token>.
# Si tu gateway espera solo el token crudo, deja el valor vacio.
ifx.authorization-prefix=Bearer
ifx.consulta.authorization-prefix=Bearer
ifx.transaccion.authorization-prefix=Bearer

# IFX paths
ifx.create-customer-path=/party-reference-data-directory-customer/v1/customer/create
ifx.retrieve-customer-path=/en-party-reference-data-directory-customer/v2/full-information/retrieve
ifx.create-merchant-path=/party-reference-data-directory-merchant/v1//create-customer/execute
ifx.create-account-path=/customer-products-and-services/v1/accounts/create

